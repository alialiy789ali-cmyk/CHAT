# ============================================================================
# Site configuration. Replace `chat.example.com` with DOMAIN and place
# fullchain.pem / privkey.pem in infra/nginx/certs/ (or switch to certbot).
#
# HSTS is intentionally conservative (no preload) so an operator can roll back
# to plain HTTP during a migration without bricking their domain.
# ============================================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # ACME HTTP-01 challenge (certbot / acme.sh webroot).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name chat.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # ------------------------------------------------------------- realtime socket
  # No proxy buffering, long read timeout: the connection carries live messages.
  location /ws {
    proxy_pass http://sovereign_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    limit_conn per_ip 10;
    access_log off;
  }

  # ------------------------------------------------------------- API
  location /api/ {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://sovereign_api;
  }

  # Tighter limit on credential endpoints (the app enforces its own policy too).
  location ~ ^/api/auth/(register|login|refresh|password/.*)$ {
    limit_req zone=api_auth burst=10 nodelay;
    proxy_pass http://sovereign_api;
  }

  # ------------------------------------------------------------- uploads
  location /api/files {
    proxy_pass http://sovereign_api;
    proxy_request_buffering on;
    client_max_body_size 55m;
    proxy_read_timeout 300s;
  }

  # ------------------------------------------------------------- web client
  location / {
    proxy_pass http://sovereign_web;
    # Never cache HTML/API responses; Next.js hashes its own immutable assets.
    proxy_no_cache 1;
  }

  location /_next/static/ {
    proxy_pass http://sovereign_web;
    proxy_cache_bypass 0;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
