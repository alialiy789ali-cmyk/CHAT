# ============================================================================
# nginx — single TLS entrypoint for the whole deployment.
#   :443  → web (Next.js)      /api → api     /ws → api (WebSocket upgrade)
#   :80   → redirect to https + ACME challenges
# TLS is expected to be provided here (Let's Encrypt or your own certificates in
# infra/nginx/certs). Terminating TLS here keeps the app containers private.
# ============================================================================

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format sovereign '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log sovereign;

  sendfile on;
  tcp_nopush on;
  # Media uploads up to 50 MB (UPLOAD_MAX_BYTES).
  client_max_body_size 55m;
  keepalive_timeout 65;
  server_tokens off;

  # ------------------------------------------------------------- compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/wasm;

  # ------------------------------------------------------------- rate limits
  # Coarse protection in front of the application-level limiter (defence in depth).
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;

  # ------------------------------------------------------------- shared proxy
  upstream sovereign_web { server web:3000; keepalive 32; }
  upstream sovereign_api { server api:8787; keepalive 32; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;

  include /etc/nginx/conf.d/*.conf;
}
