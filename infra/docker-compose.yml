# ============================================================================
# Sovereign — single-host deployment
#
#   cp .env.example .env   &&   edit the passwords/secrets/DOMAIN
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Services: PostgreSQL, Redis, MinIO, coturn (TURN), the API, the web client and
# nginx as the single TLS entrypoint. Scale the API with `--scale api=N` (the
# gateway coordinates through the shared event bus/Redis).
# ============================================================================
name: sovereign

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign}
      # Arabic/English content: UTF-8 with full collation support.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sovereign} -d ${POSTGRES_DB:-sovereign}']
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sovereign}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
    <<: *logging

  # Creates the bucket once and exits; keeps object storage zero-config.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sovereign} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET:-sovereign};
      mc anonymous set none local/${S3_BUCKET:-sovereign};
      echo 'minio bucket ready';
      "
    restart: 'no'

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # host networking is required for relay ports to work correctly.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']
    <<: *logging

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8787'
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sovereign}
      CACHE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-sovereign}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sovereign}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Sovereign <no-reply@sovereign.local>}
      PUBLIC_API_URL: https://${DOMAIN:-localhost}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?set REALTIME_TICKET_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      REGISTRATION_INVITE_ONLY: ${REGISTRATION_INVITE_ONLY:-false}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      RTC_ICE_SERVERS: ${RTC_ICE_SERVERS:-}
      RTC_TURN_URLS: ${RTC_TURN_URLS:-}
      RTC_TURN_SECRET: ${RTC_TURN_SECRET:-}
      RTC_TURN_TTL_SECONDS: ${RTC_TURN_TTL_SECONDS:-3600}
      E2EE_ENABLED: ${E2EE_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '8787'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *logging

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME_BIND: 0.0.0.0
      API_URL: http://api:8787
    expose:
      - '3000'
    <<: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    <<: *logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:
