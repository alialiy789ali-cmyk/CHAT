# ============================================================================
# coturn — self-hosted TURN/STUN for WebRTC calls behind restrictive networks.
#
# The API issues time-limited HMAC credentials (RTC_TURN_SECRET must match
# `static-auth-secret` below), so no long-lived TURN password is shipped to clients.
#
# Run:   docker compose -f infra/docker-compose.yml up -d coturn
# Verify: turnutils_uclient -v -u <user> -w <credential> <public-ip>
# ============================================================================

# ---------------------------------------------------------------- networking
listening-port=3478
tls-listening-port=5349
# `host` networking in compose maps relay ports directly; set the public IP explicitly
# when the host is behind NAT (uncomment and set your address):
# external-ip=203.0.113.10
relay-ip=0.0.0.0
min-port=49160
max-port=49200
# Public STUN for clients that can connect directly.
stun-only=false

# ---------------------------------------------------------------- authentication
# Shared secret with the API: credentials are HMAC(secret, "timestamp:username").
use-auth-secret
static-auth-secret=change-me-and-match-RTC_TURN_SECRET
realm=sovereign.local
# Deny everything by default; only authenticated allocations are allowed.
no-multicast-peers
no-cli
# Disallow relaying to private networks (prevents using TURN as an SSRF pivot).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---------------------------------------------------------------- quotas (abuse control)
# A compromised account must not be able to consume the whole relay capacity.
user-quota=12
total-quota=1200
max-bps=1000000
bps-capacity=0
stale-nonce=600
fingerprint
no-tcp-relay-off

# ---------------------------------------------------------------- TLS (turns:)
# Enable after placing certificates in infra/nginx/certs (or your ACME path):
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM"
# For letsencrypt, uncomment to allow automated renewal:
# no-tlsv1
# no-tlsv1_1

# ---------------------------------------------------------------- logging
log-file=stdout
simple-log
new-log-timestamp
